<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--primary:#005DC7;--dark:#003B85;--deep:#001E48;--soft:#E8F1FB;--bg:#eef2f7;--text:#101828;--muted:#667085;--line:#dbe3ef;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--text);letter-spacing:0}.app{display:grid;grid-template-columns:390px minmax(0,1fr);min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 24px;overflow:auto;height:100vh;position:sticky;top:0}.back{display:inline-flex;margin-bottom:14px;color:var(--primary);font-weight:800;text-decoration:none;font-size:12px}.brand{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:18px}.mark{width:44px;height:44px;border-radius:10px;background:var(--primary);color:white;display:grid;place-items:center;font-weight:900}.brand h1{font-size:17px;color:var(--deep);line-height:1.15}.brand p{font-size:12px;color:var(--muted);margin-top:2px}.section{margin:18px 0}.section-title{font-size:11px;text-transform:uppercase;font-weight:900;color:var(--muted);margin-bottom:9px}.tabs{display:grid;gap:6px}.tab{border:1px solid transparent;border-radius:8px;background:#f3f6fa;padding:10px 12px;text-align:left;font:800 13px Poppins;cursor:pointer;color:var(--text)}.tab.active{background:var(--primary);color:white;border-color:var(--dark)}.format{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.format button,.download{border:0;border-radius:10px;padding:11px 8px;font:900 11px Poppins;cursor:pointer;background:#f3f6fa;color:var(--text)}.format button.active,.download{background:var(--primary);color:white}.field{margin-bottom:12px}.field label{display:block;font-size:11px;font-weight:900;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:10px 11px;font:500 13px Poppins;background:#fff;color:var(--text)}.field textarea{min-height:72px;resize:vertical}.uploader{border:2px dashed var(--line);border-radius:12px;background:var(--soft);padding:14px;text-align:center;cursor:pointer;color:var(--muted);font-size:12px;font-weight:800}.uploader.has-image{padding:4px;border-color:var(--primary)}.photo-preview{aspect-ratio:4/3;border-radius:8px;background-size:cover;background-position:center}.logo-preview{aspect-ratio:5/2;border-radius:8px;background-size:contain;background-position:center;background-repeat:no-repeat;background-color:var(--primary)}.remove{border:0;background:transparent;color:var(--muted);text-decoration:underline;margin-top:6px;font:800 11px Poppins;cursor:pointer}.download{width:100%;margin-top:8px;font-size:14px;padding:14px}.hint{font-size:12px;line-height:1.45;color:var(--muted);background:var(--soft);border-left:4px solid var(--primary);border-radius:8px;padding:11px;margin-top:14px}.canvas-area{min-width:0;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;overflow:hidden}.badge{background:white;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:900;color:var(--muted);max-width:100%;text-align:center}.wrap{background:white;border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(16,24,40,.12);overflow:hidden;max-width:100%}.scale{transform-origin:top left}.flyer{position:relative;overflow:hidden;background:linear-gradient(180deg,#fff 0%,#f8fbff 100%);font-family:Poppins,sans-serif;color:var(--text)}.flyer,.flyer *{font-family:Poppins,sans-serif!important;letter-spacing:0}.flyer.square{width:1080px;height:1080px}.flyer.story,.flyer.vertical{width:1080px;height:1920px}.flyer::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.72));pointer-events:none}.hero{position:relative;background:linear-gradient(135deg,var(--primary),var(--dark));color:#fff;padding:54px 62px 44px;overflow:hidden}.hero::after{content:"";position:absolute;right:-150px;top:-170px;width:440px;height:440px;border-radius:50%;background:rgba(255,255,255,.09)}.story .hero,.vertical .hero{padding:86px 78px 72px}.tag{position:relative;z-index:1;display:inline-flex;background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.26);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:900;text-transform:uppercase;margin-bottom:18px;color:white}.story .tag,.vertical .tag{font-size:20px;padding:12px 24px;margin-bottom:26px}.title{position:relative;z-index:1;font-size:64px;line-height:1.02;font-weight:900;max-width:94%;color:white}.story .title,.vertical .title{font-size:96px;line-height:1.03;max-width:94%}

/* ===== CUERPO Y DETALLE (TEXTOS MÁS GRANDES) ===== */
.body{position:relative;z-index:1;padding:42px 62px 280px}
.story .body,.vertical .body{padding:72px 78px 380px}

.text{font-size:30px;line-height:1.42;color:#334155;font-weight:600}
.story .text,.vertical .text{font-size:42px;line-height:1.4}

.card{margin-top:26px;background:rgba(255,255,255,.88);border:1px solid rgba(148,163,184,.34);border-left:9px solid var(--primary);border-radius:18px;padding:28px 32px;font-size:28px;line-height:1.42;color:#1f2937;box-shadow:0 12px 26px rgba(15,23,42,.07)}
.story .card,.vertical .card{font-size:40px;padding:40px 44px;margin-top:36px;line-height:1.4}

.card strong{display:block;color:var(--primary);font-size:18px;text-transform:uppercase;margin-bottom:10px}
.story .card strong,.vertical .card strong{font-size:24px;margin-bottom:14px}

.photo{height:280px;margin:0;background:var(--soft);background-size:cover;background-position:center;display:grid;place-items:center;color:var(--muted);font-size:18px;font-weight:800;position:relative}
.photo.has-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.18));pointer-events:none}
.story .photo,.vertical .photo{height:540px;margin:0 78px;border-radius:0 0 22px 22px}

.data{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:30px}
.data div{border-left:7px solid var(--primary);padding-left:20px}
.data small{display:block;color:var(--primary);font-weight:900;text-transform:uppercase;margin-bottom:9px;font-size:19px}
.data b{font-size:34px;color:var(--deep);line-height:1.14}
.story .data,.vertical .data{gap:38px;margin-top:42px}
.story .data small,.vertical .data small{font-size:26px;margin-bottom:12px}
.story .data b,.vertical .data b{font-size:48px}

.progress{margin:28px 62px;padding:28px 34px;background:rgba(255,255,255,.88);border:1px solid rgba(148,163,184,.34);border-left:9px solid var(--primary);border-radius:18px;box-shadow:0 12px 26px rgba(15,23,42,.07)}
.story .progress,.vertical .progress{margin:46px 78px;padding:48px}

.pct{display:flex;justify-content:space-between;align-items:center;gap:18px;font-size:19px;font-weight:900;text-transform:uppercase;color:var(--dark)}
.pct b{font-size:54px;color:var(--primary)}
.story .pct,.vertical .pct{font-size:26px}
.story .pct b,.vertical .pct b{font-size:82px}

.bar{height:18px;border-radius:999px;background:#fff;border:2px solid var(--line);overflow:hidden;margin-top:14px}
.fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--dark))}

.info-card{position:relative;z-index:1;background:rgba(255,255,255,.90);border:1px solid rgba(255,255,255,.68);margin:28px 62px 280px;border-radius:22px;padding:28px 34px;color:var(--deep);box-shadow:0 16px 34px rgba(15,23,42,.12);backdrop-filter:blur(8px)}
.story .info-card,.vertical .info-card{margin:60px 78px 380px;padding:52px 56px}

.info-row{display:flex;justify-content:space-between;align-items:flex-start;gap:28px;border-bottom:1px solid rgba(15,23,42,.12);padding:17px 0;font-size:28px;font-weight:900;color:var(--deep)}
.story .info-row,.vertical .info-row{font-size:42px;padding:28px 0}
.info-row:last-child{border:0}
.info-row span{color:var(--primary);font-weight:900;text-transform:none}
.info-row b{color:var(--deep);font-weight:900;text-align:right;line-height:1.15;max-width:62%}

.alert{background:linear-gradient(180deg,#fbfdff 0%,#eef5ff 100%)}.alert .hero{background:linear-gradient(135deg,var(--primary),var(--dark))}.alert .body{padding-top:46px}.alert .text{color:#1f2937}
.conv{background:linear-gradient(160deg,var(--primary),var(--dark));color:white}.conv::after{background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.08))}.conv .body{padding:62px 62px 0}.story.conv .body,.vertical.conv .body{padding:104px 78px 0}.conv .title{font-size:76px;color:white}.story.conv .title,.vertical.conv .title{font-size:122px}.conv .text{color:white;max-width:90%;font-size:30px;line-height:1.4}.story.conv .text,.vertical.conv .text{font-size:44px}
.cut .body{padding-top:36px}.cut .card{margin-top:22px}.cut .title{font-size:58px}.story.cut .title,.vertical.cut .title{font-size:88px}

/* ===== FOOTER / ZÓCALO ===== */
.footer{position:absolute;z-index:3;left:46px;right:46px;bottom:36px;min-height:150px;display:grid;grid-template-columns:minmax(280px,0.85fr) minmax(440px,1.25fr);align-items:center;gap:32px;padding:26px 34px;color:#fff;background:linear-gradient(135deg,var(--primary),var(--dark));border:1px solid rgba(255,255,255,.34);border-radius:26px;box-shadow:0 18px 38px rgba(15,23,42,.18);overflow:hidden}
.footer::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.06));pointer-events:none}

/* Footer en story/vertical: más espacio para las redes y tipografía un poco menor */
.story .footer,.vertical .footer{left:66px;right:66px;bottom:66px;min-height:218px;padding:42px 50px;gap:48px;border-radius:34px;grid-template-columns:minmax(240px,0.75fr) minmax(560px,1.4fr)}

.footer-logo-slot,.footer-info{position:relative;z-index:1;min-width:0}
.footer-logo-slot{min-height:86px;display:flex;align-items:center;justify-content:flex-start}
.story .footer-logo-slot,.vertical .footer-logo-slot{min-height:122px}
.footer-logo-img{max-width:330px;max-height:88px;object-fit:contain;display:block;filter:brightness(0) invert(1) drop-shadow(0 2px 8px rgba(0,0,0,.12))}
.story .footer-logo-img,.vertical .footer-logo-img{max-width:380px;max-height:128px}
.footer-logo-text{color:white;line-height:1.03;font-weight:900;font-size:36px;text-shadow:0 2px 10px rgba(0,0,0,.13)}
.footer-logo-text span{display:block;font-size:15px;text-transform:uppercase;font-weight:900}
.story .footer-logo-text,.vertical .footer-logo-text{font-size:52px}
.story .footer-logo-text span,.vertical .footer-logo-text span{font-size:20px}

.footer-info{text-align:right;color:white;font-size:17px;font-weight:800;line-height:1.42;display:grid;gap:6px;justify-items:end;text-shadow:0 2px 8px rgba(0,0,0,.12)}
.story .footer-info,.vertical .footer-info{font-size:23px;gap:8px;line-height:1.35}
.footer-info div{max-width:100%;white-space:normal;word-break:break-word;overflow-wrap:anywhere}
.footer-info strong{display:block;color:white;font-weight:900}
.footer-info span{display:inline-block;padding:1px 0;font-weight:900}

.square .title.long{font-size:56px}.story .title.long,.vertical .title.long{font-size:82px}.square .title.xlong{font-size:46px}.story .title.xlong,.vertical .title.xlong{font-size:68px}.square.conv .title.long{font-size:66px}.square.conv .title.xlong{font-size:56px}@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:relative}.canvas-area{padding:18px}.wrap{max-width:100%}}@media(max-width:560px){.canvas-area{padding:12px}.wrap{padding:12px}.badge{font-size:11px}.format{grid-template-columns:1fr}.sidebar{padding:18px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<a class="back" href="./">← Volver al panel</a>
<div class="brand"><div class="mark">TA</div><div><h1>Generador de Flyers</h1><p>Comunicación municipal</p></div></div>
<div class="section"><div class="section-title">Tipo de comunicación</div><div class="tabs" id="tipoTabs"></div></div>
<div class="section"><div class="section-title">Secretaría</div><div class="field"><label>Área institucional</label><select id="sec"></select></div></div>
<div class="section"><div class="section-title">Formato</div><div class="format"><button class="active" data-format="square">Cuadrado</button><button data-format="story">Historia</button><button data-format="vertical">9:16</button></div></div>
<div class="section"><div class="section-title">Logo del zócalo</div><div class="uploader" id="logoUp">Cargar logo municipal</div><input id="logoInput" type="file" accept="image/*" hidden><button class="remove" id="removeLogo" style="display:none">Quitar logo</button></div>
<div class="section"><div class="section-title">Contenido</div><div id="fields"></div><div id="photoBox" style="display:none"><div class="uploader" id="up">Subí una foto o render</div><input id="photoInput" type="file" accept="image/*" hidden><button class="remove" id="removePhoto" style="display:none">Quitar foto</button></div></div>
<button class="download" id="download">Descargar PNG</button>
<div class="hint"><strong>Listo para redes:</strong> todos los formatos exportan con Poppins y proporciones ajustadas.</div>
</aside>
<main class="canvas-area"><div class="badge" id="badge"></div><div class="wrap"><div class="scale" id="scale"><div class="flyer square" id="flyer"></div></div></div></main>
</div>
<script>
const SECRETARIAS={municipio:['Municipio General','#005DC7','#003B85','#001E48','#E8F1FB'],obras:['Planeamiento Urbano','#0F8A5F','#0A6B49','#064532','#E7F5EF'],salud:['Salud','#19C2B3','#129487','#0A5F57','#E8FBF9'],desarrollo:['Desarrollo Social','#D80A52','#A3083E','#6A0428','#FCE7EE'],seguridad:['Seguridad','#1E3A67','#152C4E','#0D1B31','#E9EEF6'],cultura:['Cultura y Educación','#FF4338','#D72F25','#941B15','#FFE9E7'],ambiente:['Ambiente','#7AD14B','#59A432','#34651B','#EEF9E8'],hacienda:['Hacienda','#A8927B','#7E6A56','#544536','#F3EEE9'],juventud:['Juventud','#F6A400','#C17D00','#7B5000','#FFF4DA'],deportes:['Deportes','#18A9D1','#0E7F9F','#08586E','#E8F8FC'],omic:['OMIC','#7258C7','#573FA1','#39296D','#EEE9FB']};
const TIPOS={inicio:'Inicio de obra',ejecucion:'En ejecución / avance',corte:'Corte de tránsito',inauguracion:'Inauguración',comunicado:'Comunicado oficial',crisis:'Gestión de crisis',convocatoria:'Convocatoria a vecinos'};
const CAMPOS={inicio:[['tag','Etiqueta'],['titulo','Título'],['categoria','Categoría / barrio'],['descripcion','Descripción','area'],['label1','Etiqueta dato 1'],['value1','Valor dato 1'],['label2','Etiqueta dato 2'],['value2','Valor dato 2']],ejecucion:[['pretitulo','Etiqueta'],['titulo','Título'],['subtitulo','Subtítulo'],['avance','Porcentaje avance'],['etapa','Etapa actual'],['label1','Etiqueta dato 1'],['value1','Valor dato 1'],['label2','Etiqueta dato 2'],['value2','Valor dato 2']],corte:[['asunto','Asunto'],['calle','Calle / zona','area'],['desde','Desde'],['hasta','Hasta'],['desvio','Desvío / info adicional','area']],inauguracion:[['stamp','Etiqueta'],['titulo','Nombre de la obra'],['descripcion','Descripción','area'],['label1','Etiqueta dato 1'],['value1','Valor dato 1'],['label2','Etiqueta dato 2'],['value2','Valor dato 2']],comunicado:[['etiqueta','Etiqueta'],['titulo','Título'],['copete','Copete','area'],['contenido','Texto comunicado','area']],crisis:[['estado','Estado'],['titulo','Título'],['detalle','Detalle oficial','area'],['recomendaciones','Recomendaciones','area']],convocatoria:[['pretitulo','Etiqueta'],['titulo','Frase principal'],['subtitulo','Texto explicativo','area'],['label1','Etiqueta 1'],['value1','Valor 1'],['label2','Etiqueta 2'],['value2','Valor 2'],['label3','Etiqueta 3'],['value3','Valor 3']]};
const state={tipo:'inicio',format:'square',sec:'municipio',foto:null,logo:null,campos:{inicio:{tag:'Comienza una nueva obra',titulo:'Pavimentación de calles',categoria:'Obra vial · Barrio Norte',descripcion:'Comenzamos los trabajos para mejorar la conectividad y seguridad vial de los vecinos.',label1:'Ubicación',value1:'Av. Belgrano y aledañas',label2:'Plazo estimado',value2:'90 días'},ejecucion:{pretitulo:'Obra en ejecución',titulo:'Nuevo SUM Barrio Sur',subtitulo:'Construcción de salón de usos múltiples',avance:'45',etapa:'Estructura terminada',label1:'Inicio',value1:'Marzo 2026',label2:'Finalización',value2:'Agosto 2026'},corte:{asunto:'Corte total de tránsito',calle:'Av. Moreno entre San Martín y Rivadavia',desde:'Lunes 25/05 · 7:00 hs',hasta:'Viernes 29/05 · 19:00 hs',desvio:'Desvío sugerido por calle Mitre y Belgrano.'},inauguracion:{stamp:'Quedó inaugurada',titulo:'Plaza de los Niños',descripcion:'Renovamos la plaza con juegos, mobiliario urbano, iluminación LED y cancha multideporte.',label1:'Día',value1:'Sábado 24/05',label2:'Hora',value2:'11:00 hs'},comunicado:{etiqueta:'Comunicado Oficial',titulo:'Información importante para la comunidad',copete:'La Municipalidad de Tres Arroyos informa a vecinos y vecinas sobre las acciones que se están llevando adelante.',contenido:'Esta comunicación reúne información oficial, fechas relevantes y canales de consulta.'},crisis:{estado:'Información oficial',titulo:'Situación en seguimiento',detalle:'Los equipos municipales se encuentran trabajando y monitoreando la situación.',recomendaciones:'Seguí únicamente los canales oficiales. Evitá circular información no verificada.'},convocatoria:{pretitulo:'Encuentro vecinal',titulo:'Te invitamos',subtitulo:'Vení a participar de la próxima reunión barrial para presentar el plan de obras y escuchar propuestas.',label1:'Día',value1:'Jueves 22/05',label2:'Hora',value2:'19:00 hs',label3:'Lugar',value3:'Club Social Tres Arroyos'}}};
const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function init(){Object.entries(TIPOS).forEach(([k,v])=>$('tipoTabs').insertAdjacentHTML('beforeend',`<button class="tab ${k===state.tipo?'active':''}" data-tipo="${k}">${v}</button>`));Object.entries(SECRETARIAS).forEach(([k,v])=>$('sec').insertAdjacentHTML('beforeend',`<option value="${k}">${v[0]}</option>`));bind();theme();renderFields();render()}
function bind(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tipo=b.dataset.tipo;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));renderFields();render()});document.querySelectorAll('.format button').forEach(b=>b.onclick=()=>{state.format=b.dataset.format;document.querySelectorAll('.format button').forEach(x=>x.classList.toggle('active',x===b));render()});$('sec').onchange=e=>{state.sec=e.target.value;theme();render()};$('up').onclick=()=>$('photoInput').click();$('photoInput').onchange=e=>readImage(e.target.files[0],src=>{state.foto=src;$('up').classList.add('has-image');$('up').innerHTML=`<div class="photo-preview" style="background-image:url('${state.foto}')"></div>`;$('removePhoto').style.display='block';render()});$('removePhoto').onclick=()=>{state.foto=null;$('up').classList.remove('has-image');$('up').textContent='Subí una foto o render';$('removePhoto').style.display='none';render()};$('logoUp').onclick=()=>$('logoInput').click();$('logoInput').onchange=e=>readImage(e.target.files[0],src=>{state.logo=src;$('logoUp').classList.add('has-image');$('logoUp').innerHTML=`<div class="logo-preview" style="background-image:url('${state.logo}')"></div>`;$('removeLogo').style.display='block';render()});$('removeLogo').onclick=()=>{state.logo=null;$('logoUp').classList.remove('has-image');$('logoUp').textContent='Cargar logo municipal';$('removeLogo').style.display='none';render()};$('download').onclick=download}
function readImage(file,cb){if(!file)return;const r=new FileReader();r.onload=ev=>cb(ev.target.result);r.readAsDataURL(file)}
function theme(){const t=SECRETARIAS[state.sec];document.documentElement.style.setProperty('--primary',t[1]);document.documentElement.style.setProperty('--dark',t[2]);document.documentElement.style.setProperty('--deep',t[3]);document.documentElement.style.setProperty('--soft',t[4])}
function renderFields(){const box=$('fields');box.innerHTML='';CAMPOS[state.tipo].forEach(([k,l,type])=>{const v=esc(state.campos[state.tipo][k]);box.insertAdjacentHTML('beforeend',`<div class="field"><label>${l}</label>${type==='area'?`<textarea data-key="${k}">${v}</textarea>`:`<input data-key="${k}" value="${v}">`}</div>`)});box.querySelectorAll('input,textarea').forEach(el=>el.oninput=e=>{state.campos[state.tipo][e.target.dataset.key]=e.target.value;render()});$('photoBox').style.display=['inicio','ejecucion','inauguracion'].includes(state.tipo)?'block':'none'}
function titleClass(v){const l=String(v||'').length;return l>52?' xlong':l>34?' long':''}
function footer(){const logo=state.logo?`<img class="footer-logo-img" src="${state.logo}" alt="Municipalidad de Tres Arroyos">`:`<div class="footer-logo-text"><span>Municipalidad</span>Tres Arroyos</div>`;return `<div class="footer"><div class="footer-logo-slot">${logo}</div><div class="footer-info"><div><strong>www.tresarroyos.gov.ar</strong></div><div><span>Instagram:</span> municipalidadtresarroyos</div><div><span>Facebook:</span> municipalidaddetresarroyos</div><div><span>Arroyito:</span> 2983509001</div></div></div>`}
function photo(){return `<div class="photo ${state.foto?'has-photo':''}" ${state.foto?`style="background-image:url('${state.foto}')"`:''}>${state.foto?'':'Foto / render'}</div>`}
function render(){const c=state.campos[state.tipo],f=$('flyer');f.className=`flyer ${state.format}`;let h='';if(state.tipo==='convocatoria'){f.classList.add('conv');h=`<div class="body"><div class="tag">${esc(c.pretitulo)}</div><div class="title${titleClass(c.titulo)}">${esc(c.titulo)}</div><p class="text">${esc(c.subtitulo)}</p></div><div class="info-card"><div class="info-row"><span>${esc(c.label1)}</span><b>${esc(c.value1)}</b></div><div class="info-row"><span>${esc(c.label2)}</span><b>${esc(c.value2)}</b></div><div class="info-row"><span>${esc(c.label3)}</span><b>${esc(c.value3)}</b></div></div>${footer()}`}else if(state.tipo==='crisis'){f.classList.add('alert');h=`<div class="hero"><div class="tag">${esc(c.estado)}</div><div class="title${titleClass(c.titulo)}">${esc(c.titulo)}</div></div><div class="body"><p class="text">${esc(c.detalle)}</p><div class="card"><strong>Recomendaciones oficiales</strong>${esc(c.recomendaciones)}</div></div>${footer()}`}else if(state.tipo==='ejecucion'){const p=Math.max(0,Math.min(100,parseInt(c.avance)||0));h=`<div class="hero"><div class="tag">${esc(c.pretitulo)}</div><div class="title${titleClass(c.titulo)}">${esc(c.titulo)}</div><p class="text" style="color:white;margin-top:14px">${esc(c.subtitulo)}</p></div><div class="progress"><div class="pct"><span>Avance · ${esc(c.etapa)}</span><b>${p}%</b></div><div class="bar"><div class="fill" style="width:${p}%"></div></div></div>${photo()}<div class="body"><div class="data"><div><small>${esc(c.label1)}</small><b>${esc(c.value1)}</b></div><div><small>${esc(c.label2)}</small><b>${esc(c.value2)}</b></div></div></div>${footer()}`}else if(state.tipo==='corte'){f.classList.add('cut');h=`<div class="hero"><div class="tag">Atención</div><div class="title${titleClass(c.asunto)}">${esc(c.asunto)}</div></div><div class="body"><div class="card"><strong>Zona afectada</strong>${esc(c.calle)}</div><div class="data"><div><small>Desde</small><b>${esc(c.desde)}</b></div><div><small>Hasta</small><b>${esc(c.hasta)}</b></div></div><div class="card"><strong>Información para vecinos</strong>${esc(c.desvio)}</div></div>${footer()}`}else if(state.tipo==='inauguracion'||state.tipo==='inicio'){const tt=c.titulo;h=`<div class="hero"><div class="tag">${esc(c.tag||c.stamp)}</div><div class="title${titleClass(tt)}">${esc(tt)}</div>${c.categoria?`<p class="text" style="color:white;margin-top:14px">${esc(c.categoria)}</p>`:''}</div>${photo()}<div class="body"><p class="text">${esc(c.descripcion)}</p><div class="data"><div><small>${esc(c.label1)}</small><b>${esc(c.value1)}</b></div><div><small>${esc(c.label2)}</small><b>${esc(c.value2)}</b></div></div></div>${footer()}`}else{h=`<div class="hero"><div class="tag">${esc(c.etiqueta)}</div><div class="title${titleClass(c.titulo)}">${esc(c.titulo)}</div></div><div class="body"><p class="text"><strong>${esc(c.copete)}</strong></p><div class="card"><strong>Información oficial</strong>${esc(c.contenido)}</div></div>${footer()}`}f.innerHTML=h;$('badge').textContent=`${TIPOS[state.tipo]} · ${state.format==='square'?'Cuadrado 1080x1080':state.format==='story'?'Historia 1080x1920':'9:16 vertical 1080x1920'}`;scale()}
function scale(){const baseW=1080,baseH=state.format==='square'?1080:1920,area=document.querySelector('.canvas-area'),rect=area.getBoundingClientRect(),maxW=Math.max(220,rect.width-42),maxH=Math.max(260,window.innerHeight-112),s=Math.min(maxW/baseW,maxH/baseH,.62);const z=Math.max(.16,s);$('scale').style.width=baseW+'px';$('scale').style.height=baseH+'px';$('scale').style.transform=`scale(${z})`;document.querySelector('.wrap').style.width=Math.ceil(baseW*z+36)+'px';document.querySelector('.wrap').style.height=Math.ceil(baseH*z+36)+'px'}
async function download(){const b=$('download');b.disabled=true;b.textContent='Generando...';if(document.fonts&&document.fonts.ready)await document.fonts.ready;const old=$('scale').style.transform;$('scale').style.transform='scale(1)';await new Promise(r=>setTimeout(r,120));const w=1080,h=state.format==='square'?1080:1920;const canvas=await html2canvas($('flyer'),{width:w,height:h,scale:1,useCORS:true,backgroundColor:null});$('scale').style.transform=old;scale();const a=document.createElement('a');a.download=`TresArroyos_${state.tipo}_${state.format}_${new Date().toISOString().slice(0,10)}.png`;a.href=canvas.toDataURL('image/png');a.click();b.disabled=false;b.textContent='Descargar PNG'}
window.addEventListener('resize',scale);if(document.fonts&&document.fonts.ready){document.fonts.ready.then(init)}else{init()}
</script>
</body>
