<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Flyers · Tres Arroyos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--primary:#005DC7;--dark:#003B85;--deep:#001E48;--soft:#E8F1FB;--bg:#eef2f7;--text:#101828;--muted:#667085;--line:#dbe3ef;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--text)}
.app{display:grid;grid-template-columns:390px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 24px;overflow:auto;height:100vh;position:sticky;top:0}.back{display:inline-flex;margin-bottom:14px;color:var(--primary);font-weight:800;text-decoration:none;font-size:12px}.brand{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:18px}.mark{width:44px;height:44px;border-radius:10px;background:var(--primary);color:white;display:grid;place-items:center;font-weight:900}.brand h1{font-size:17px;color:var(--deep);line-height:1.15}.brand p{font-size:12px;color:var(--muted);margin-top:2px}.section{margin:18px 0}.section-title{font-size:11px;text-transform:uppercase;font-weight:900;letter-spacing:.06em;color:var(--muted);margin-bottom:9px}.tabs{display:grid;gap:6px}.tab{border:1px solid transparent;border-radius:8px;background:#f3f6fa;padding:10px 12px;text-align:left;font:800 13px Poppins;cursor:pointer;color:var(--text)}.tab.active{background:var(--primary);color:white;border-color:var(--dark)}.format{display:grid;grid-template-columns:1fr 1fr;gap:7px}.format button,.download{border:0;border-radius:10px;padding:11px 10px;font:900 12px Poppins;cursor:pointer;background:#f3f6fa;color:var(--text)}.format button.active,.download{background:var(--primary);color:white}.field{margin-bottom:12px}.field label{display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:10px 11px;font:500 13px Poppins;background:#fff;color:var(--text)}.field textarea{min-height:72px;resize:vertical}.uploader{border:2px dashed var(--line);border-radius:12px;background:var(--soft);padding:14px;text-align:center;cursor:pointer;color:var(--muted);font-size:12px;font-weight:800}.uploader.has-image{padding:4px;border-color:var(--primary)}.photo-preview,.logo-preview{aspect-ratio:4/3;border-radius:8px;background-size:cover;background-position:center}.logo-preview{aspect-ratio:5/2;background-size:contain;background-repeat:no-repeat;background-color:#0f8f62}.remove{border:0;background:transparent;color:var(--muted);text-decoration:underline;margin-top:6px;font:800 11px Poppins;cursor:pointer}.download{width:100%;margin-top:8px;font-size:14px;padding:14px}.hint{font-size:12px;line-height:1.45;color:var(--muted);background:var(--soft);border-left:4px solid var(--primary);border-radius:8px;padding:11px;margin-top:14px}.canvas-area{padding:26px;display:flex;flex-direction:column;align-items:center;gap:14px}.badge{background:white;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:900;color:var(--muted)}.wrap{background:white;border-radius:14px;padding:18px;box-shadow:0 20px 60px rgba(16,24,40,.12)}.scale{transform-origin:top left}.flyer{position:relative;overflow:hidden;background:white;font-family:Poppins,sans-serif}.flyer.square{width:1080px;height:1080px}.flyer.story{width:1080px;height:1920px}
.footer{position:absolute;left:0;right:0;bottom:0;min-height:142px;background:var(--primary);display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,1.1fr);align-items:center;gap:52px;padding:28px 66px;color:white}.story .footer{min-height:206px;padding:48px 86px;gap:72px}.footer-logo-slot{min-height:72px;display:flex;align-items:center;justify-content:flex-start}.story .footer-logo-slot{min-height:104px}.footer-logo-img{max-width:305px;max-height:82px;object-fit:contain;display:block;filter:brightness(0) invert(1)}.story .footer-logo-img{max-width:420px;max-height:118px}.footer-logo-text{color:white;line-height:1.04;font-weight:900;font-size:32px;letter-spacing:-.03em}.footer-logo-text span{display:block;font-size:14px;text-transform:uppercase;letter-spacing:.08em;font-weight:900}.story .footer-logo-text{font-size:46px}.story .footer-logo-text span{font-size:20px}.footer-info{text-align:right;color:white;font-size:16px;font-weight:800;line-height:1.65;display:grid;gap:4px;justify-items:end}.story .footer-info{font-size:24px;gap:7px}.footer-info div{max-width:100%;white-space:normal}.footer-info strong{display:block;color:white;font-weight:900}.top{background:linear-gradient(135deg,var(--primary),var(--dark));color:white;padding:50px 60px 42px}.story .top{padding:96px 80px 76px}.tag{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:9px 17px;font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:.09em;margin-bottom:16px}.story .tag{font-size:26px;padding:14px 28px}.title{font-size:68px;line-height:.98;font-weight:900;letter-spacing:-.04em;max-width:88%}.story .title{font-size:120px}.body{padding:42px 60px 184px}.story .body{padding:70px 80px 270px}.text{font-size:25px;line-height:1.42;color:#344054}.story .text{font-size:38px}.card{margin-top:24px;background:var(--soft);border-left:8px solid var(--primary);border-radius:14px;padding:24px 28px;font-size:23px;line-height:1.42}.story .card{font-size:34px;padding:36px}.card strong{display:block;color:var(--primary);font-size:16px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}.photo{height:285px;margin:0;background:var(--soft);background-size:cover;background-position:center;display:grid;place-items:center;color:var(--muted);font-size:20px;font-weight:800}.story .photo{height:560px;margin:0 80px}.data{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:24px}.data div{border-left:5px solid var(--primary);padding-left:18px}.data small{display:block;color:var(--primary);font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}.data b{font-size:25px;color:var(--deep)}.story .data b{font-size:40px}.progress{margin:24px 60px;padding:26px 34px;background:var(--soft);border-left:8px solid var(--primary);border-radius:14px}.story .progress{margin:42px 80px;padding:48px}.pct{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:900;text-transform:uppercase;color:var(--dark)}.pct b{font-size:46px;color:var(--primary)}.story .pct b{font-size:82px}.bar{height:18px;border-radius:999px;background:white;border:2px solid var(--line);overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--dark))}.alert{background:linear-gradient(180deg,#101828,#09111d);color:white}.alert .top{background:linear-gradient(135deg,var(--primary),var(--dark))}.alert .body{padding-top:52px}.alert .text{color:#f2f4f7}.alert .card{background:rgba(255,255,255,.08);color:white;border-color:var(--primary)}.alert .card strong{color:var(--primary)}.conv{background:var(--primary);color:white}.conv .body{padding:58px 60px 0}.conv .title{font-size:82px}.story.conv .title{font-size:160px}.conv .text{color:white;max-width:88%;font-size:24px}.story.conv .text{font-size:38px}.info-card{background:white;color:var(--text);margin:28px 60px 184px;border-radius:16px;padding:26px 32px}.story .info-card{margin:60px 80px 270px;padding:50px 56px}.info-row{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding:12px 0;font-size:23px;font-weight:800}.story .info-row{font-size:40px;padding:22px 0}.info-row:last-child{border:0}.cut .body{padding-top:34px}.cut .card{margin-top:18px}.cut .title{font-size:58px}.story.cut .title{font-size:112px}@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:relative}.canvas-area{padding:18px}.wrap{max-width:100%;overflow:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<a class="back" href="./">← Volver al panel</a>
<div class="brand"><div class="mark">TA</div><div><h1>Generador de Flyers</h1><p>Comunicación municipal</p></div></div>
<div class="section"><div class="section-title">Tipo de comunicación</div><div class="tabs" id="tipoTabs"></div></div>
<div class="section"><div class="section-title">Secretaría</div><div class="field"><label>Área institucional</label><select id="sec"></select></div></div>
<div class="section"><div class="section-title">Formato</div><div class="format"><button class="active" data-format="square">Cuadrado</button><button data-format="story">Story</button></div></div>
<div class="section"><div class="section-title">Logo del zócalo</div><div class="uploader" id="logoUp">Cargar logo municipal</div><input id="logoInput" type="file" accept="image/*" hidden><button class="remove" id="removeLogo" style="display:none">Quitar logo</button></div>
<div class="section"><div class="section-title">Contenido</div><div id="fields"></div><div id="photoBox" style="display:none"><div class="uploader" id="up">Subí una foto o render</div><input id="photoInput" type="file" accept="image/*" hidden><button class="remove" id="removePhoto" style="display:none">Quitar foto</button></div></div>
<button class="download" id="download">Descargar PNG</button>
<div class="hint"><strong>Listo para redes:</strong> elegí tipo, secretaría y formato. El pie usa la banda del color institucional activo.</div>
</aside>
<main class="canvas-area"><div class="badge" id="badge"></div><div class="wrap"><div class="scale" id="scale"><div class="flyer square" id="flyer"></div></div></div></main>
</div>
<script>
const SECRETARIAS={municipio:['Municipio General','#005DC7','#003B85','#001E48','#E8F1FB'],obras:['Planeamiento Urbano','#0F8A5F','#0A6B49','#064532','#E7F5EF'],salud:['Salud','#19C2B3','#129487','#0A5F57','#E8FBF9'],desarrollo:['Desarrollo Social','#D80A52','#A3083E','#6A0428','#FCE7EE'],seguridad:['Seguridad','#1E3A67','#152C4E','#0D1B31','#E9EEF6'],cultura:['Cultura y Educación','#FF4338','#D72F25','#941B15','#FFE9E7'],ambiente:['Ambiente','#7AD14B','#59A432','#34651B','#EEF9E8'],hacienda:['Hacienda','#A8927B','#7E6A56','#544536','#F3EEE9'],juventud:['Juventud','#F6A400','#C17D00','#7B5000','#FFF4DA'],deportes:['Deportes','#18A9D1','#0E7F9F','#08586E','#E8F8FC'],omic:['OMIC','#7258C7','#573FA1','#39296D','#EEE9FB']};
const TIPOS={inicio:'Inicio de obra',ejecucion:'En ejecución / avance',corte:'Corte de tránsito',inauguracion:'Inauguración',comunicado:'Comunicado oficial',crisis:'Gestión de crisis',convocatoria:'Convocatoria a vecinos'};
const CAMPOS={inicio:[['tag','Etiqueta'],['titulo','Título'],['categoria','Categoría / barrio'],['descripcion','Descripción','area'],['label1','Etiqueta dato 1'],['value1','Valor dato 1'],['label2','Etiqueta dato 2'],['value2','Valor dato 2']],ejecucion:[['pretitulo','Etiqueta'],['titulo','Título'],['subtitulo','Subtítulo'],['avance','Porcentaje avance'],['etapa','Etapa actual'],['label1','Etiqueta dato 1'],['value1','Valor dato 1'],['label2','Etiqueta dato 2'],['value2','Valor dato 2']],corte:[['asunto','Asunto'],['calle','Calle / zona','area'],['desde','Desde'],['hasta','Hasta'],['desvio','Desvío / info adicional','area']],inauguracion:[['stamp','Etiqueta'],['titulo','Nombre de la obra'],['descripcion','Descripción','area'],['label1','Etiqueta dato 1'],['value1','Valor dato 1'],['label2','Etiqueta dato 2'],['value2','Valor dato 2']],comunicado:[['etiqueta','Etiqueta'],['titulo','Título'],['copete','Copete','area'],['contenido','Texto comunicado','area']],crisis:[['estado','Estado'],['titulo','Título'],['detalle','Detalle oficial','area'],['recomendaciones','Recomendaciones','area']],convocatoria:[['pretitulo','Etiqueta'],['titulo','Frase principal'],['subtitulo','Texto explicativo','area'],['label1','Etiqueta 1'],['value1','Valor 1'],['label2','Etiqueta 2'],['value2','Valor 2'],['label3','Etiqueta 3'],['value3','Valor 3']]};
const state={tipo:'inicio',format:'square',sec:'municipio',foto:null,logo:null,campos:{inicio:{tag:'Comienza una nueva obra',titulo:'Pavimentación de calles',categoria:'Obra vial · Barrio Norte',descripcion:'Comenzamos los trabajos para mejorar la conectividad y seguridad vial de los vecinos.',label1:'Ubicación',value1:'Av. Belgrano y aledañas',label2:'Plazo estimado',value2:'90 días'},ejecucion:{pretitulo:'Obra en ejecución',titulo:'Nuevo SUM Barrio Sur',subtitulo:'Construcción de salón de usos múltiples',avance:'45',etapa:'Estructura terminada',label1:'Inicio',value1:'Marzo 2026',label2:'Finalización',value2:'Agosto 2026'},corte:{asunto:'Corte total de tránsito',calle:'Av. Moreno entre San Martín y Rivadavia',desde:'Lunes 25/05 · 7:00 hs',hasta:'Viernes 29/05 · 19:00 hs',desvio:'Desvío sugerido por calle Mitre y Belgrano.'},inauguracion:{stamp:'Quedó inaugurada',titulo:'Plaza de los Niños',descripcion:'Renovamos la plaza con juegos, mobiliario urbano, iluminación LED y cancha multideporte.',label1:'Día',value1:'Sábado 24/05',label2:'Hora',value2:'11:00 hs'},comunicado:{etiqueta:'Comunicado Oficial',titulo:'Información importante para la comunidad',copete:'La Municipalidad de Tres Arroyos informa a vecinos y vecinas sobre las acciones que se están llevando adelante.',contenido:'Esta comunicación reúne información oficial, fechas relevantes y canales de consulta.'},crisis:{estado:'Información oficial',titulo:'Situación en seguimiento',detalle:'Los equipos municipales se encuentran trabajando y monitoreando la situación.',recomendaciones:'Seguí únicamente los canales oficiales. Evitá circular información no verificada.'},convocatoria:{pretitulo:'Encuentro vecinal',titulo:'Te invitamos',subtitulo:'Vení a participar de la próxima reunión barrial para presentar el plan de obras y escuchar propuestas.',label1:'Día',value1:'Jueves 22/05',label2:'Hora',value2:'19:00 hs',label3:'Lugar',value3:'Club Social Tres Arroyos'}}};
const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function init(){Object.entries(TIPOS).forEach(([k,v])=>$('tipoTabs').insertAdjacentHTML('beforeend',`<button class="tab ${k===state.tipo?'active':''}" data-tipo="${k}">${v}</button>`));Object.entries(SECRETARIAS).forEach(([k,v])=>$('sec').insertAdjacentHTML('beforeend',`<option value="${k}">${v[0]}</option>`));bind();theme();renderFields();render()}
function bind(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tipo=b.dataset.tipo;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));renderFields();render()});document.querySelectorAll('.format button').forEach(b=>b.onclick=()=>{state.format=b.dataset.format;document.querySelectorAll('.format button').forEach(x=>x.classList.toggle('active',x===b));render()});$('sec').onchange=e=>{state.sec=e.target.value;theme();render()};$('up').onclick=()=>$('photoInput').click();$('photoInput').onchange=e=>readImage(e.target.files[0],src=>{state.foto=src;$('up').classList.add('has-image');$('up').innerHTML=`<div class="photo-preview" style="background-image:url('${state.foto}')"></div>`;$('removePhoto').style.display='block';render()});$('removePhoto').onclick=()=>{state.foto=null;$('up').classList.remove('has-image');$('up').textContent='Subí una foto o render';$('removePhoto').style.display='none';render()};$('logoUp').onclick=()=>$('logoInput').click();$('logoInput').onchange=e=>readImage(e.target.files[0],src=>{state.logo=src;$('logoUp').classList.add('has-image');$('logoUp').innerHTML=`<div class="logo-preview" style="background-image:url('${state.logo}')"></div>`;$('removeLogo').style.display='block';render()});$('removeLogo').onclick=()=>{state.logo=null;$('logoUp').classList.remove('has-image');$('logoUp').textContent='Cargar logo municipal';$('removeLogo').style.display='none';render()};$('download').onclick=download}
function readImage(file,cb){if(!file)return;const r=new FileReader();r.onload=ev=>cb(ev.target.result);r.readAsDataURL(file)}
function theme(){const t=SECRETARIAS[state.sec];document.documentElement.style.setProperty('--primary',t[1]);document.documentElement.style.setProperty('--dark',t[2]);document.documentElement.style.setProperty('--deep',t[3]);document.documentElement.style.setProperty('--soft',t[4])}
function renderFields(){const box=$('fields');box.innerHTML='';CAMPOS[state.tipo].forEach(([k,l,type])=>{const v=esc(state.campos[state.tipo][k]);box.insertAdjacentHTML('beforeend',`<div class="field"><label>${l}</label>${type==='area'?`<textarea data-key="${k}">${v}</textarea>`:`<input data-key="${k}" value="${v}">`}</div>`)});box.querySelectorAll('input,textarea').forEach(el=>el.oninput=e=>{state.campos[state.tipo][e.target.dataset.key]=e.target.value;render()});$('photoBox').style.display=['inicio','ejecucion','inauguracion'].includes(state.tipo)?'block':'none'}
function footer(){const logo=state.logo?`<img class="footer-logo-img" src="${state.logo}" alt="Municipalidad de Tres Arroyos">`:`<div class="footer-logo-text"><span>Municipalidad</span>Tres Arroyos</div>`;return `<div class="footer"><div class="footer-logo-slot">${logo}</div><div class="footer-info"><div><strong>www.tresarroyos.gov.ar</strong></div><div>Instagram: municipalidadtresarroyos</div><div>Facebook: municipalidaddetresarroyos</div><div>Arroyito: 2983509001</div></div></div>`}
function photo(){return `<div class="photo" ${state.foto?`style="background-image:url('${state.foto}')"`:''}>${state.foto?'':'Foto / render'}</div>`}
function render(){const c=state.campos[state.tipo],f=$('flyer');f.className=`flyer ${state.format}`;let h='';if(state.tipo==='convocatoria'){f.classList.add('conv');h=`<div class="body"><div class="tag">${esc(c.pretitulo)}</div><div class="title">${esc(c.titulo)}</div><p class="text">${esc(c.subtitulo)}</p></div><div class="info-card"><div class="info-row"><span>${esc(c.label1)}</span><b>${esc(c.value1)}</b></div><div class="info-row"><span>${esc(c.label2)}</span><b>${esc(c.value2)}</b></div><div class="info-row"><span>${esc(c.label3)}</span><b>${esc(c.value3)}</b></div></div>${footer()}`}else if(state.tipo==='crisis'){f.classList.add('alert');h=`<div class="top"><div class="tag">${esc(c.estado)}</div><div class="title">${esc(c.titulo)}</div></div><div class="body"><p class="text">${esc(c.detalle)}</p><div class="card"><strong>Recomendaciones oficiales</strong>${esc(c.recomendaciones)}</div></div>${footer()}`}else if(state.tipo==='ejecucion'){const p=Math.max(0,Math.min(100,parseInt(c.avance)||0));h=`<div class="top"><div class="tag">${esc(c.pretitulo)}</div><div class="title">${esc(c.titulo)}</div><p class="text" style="color:white;margin-top:14px">${esc(c.subtitulo)}</p></div><div class="progress"><div class="pct"><span>Avance · ${esc(c.etapa)}</span><b>${p}%</b></div><div class="bar"><div class="fill" style="width:${p}%"></div></div></div>${photo()}<div class="body"><div class="data"><div><small>${esc(c.label1)}</small><b>${esc(c.value1)}</b></div><div><small>${esc(c.label2)}</small><b>${esc(c.value2)}</b></div></div></div>${footer()}`}else if(state.tipo==='corte'){f.classList.add('cut');h=`<div class="top"><div class="tag">Atención</div><div class="title">${esc(c.asunto)}</div></div><div class="body"><div class="card"><strong>Zona afectada</strong>${esc(c.calle)}</div><div class="data"><div><small>Desde</small><b>${esc(c.desde)}</b></div><div><small>Hasta</small><b>${esc(c.hasta)}</b></div></div><div class="card"><strong>Información para vecinos</strong>${esc(c.desvio)}</div></div>${footer()}`}else if(state.tipo==='inauguracion'||state.tipo==='inicio'){h=`<div class="top"><div class="tag">${esc(c.tag||c.stamp)}</div><div class="title">${esc(c.titulo)}</div>${c.categoria?`<p class="text" style="color:white;margin-top:14px">${esc(c.categoria)}</p>`:''}</div>${photo()}<div class="body"><p class="text">${esc(c.descripcion)}</p><div class="data"><div><small>${esc(c.label1)}</small><b>${esc(c.value1)}</b></div><div><small>${esc(c.label2)}</small><b>${esc(c.value2)}</b></div></div></div>${footer()}`}else{h=`<div class="top"><div class="tag">${esc(c.etiqueta)}</div><div class="title">${esc(c.titulo)}</div></div><div class="body"><p class="text"><strong>${esc(c.copete)}</strong></p><div class="card"><strong>Información oficial</strong>${esc(c.contenido)}</div></div>${footer()}`}f.innerHTML=h;$('badge').textContent=`${TIPOS[state.tipo]} · ${state.format==='square'?'Cuadrado 1080x1080':'Story 1080x1920'}`;scale()}
function scale(){const baseW=1080,baseH=state.format==='square'?1080:1920,availW=Math.min(window.innerWidth-450,720),availH=window.innerHeight-130,s=Math.min(availW/baseW,availH/baseH,.65);const z=Math.max(.22,s);$('scale').style.width=baseW+'px';$('scale').style.height=baseH+'px';$('scale').style.transform=`scale(${z})`;document.querySelector('.wrap').style.width=(baseW*z+36)+'px';document.querySelector('.wrap').style.height=(baseH*z+36)+'px'}
async function download(){const b=$('download');b.disabled=true;b.textContent='Generando...';const old=$('scale').style.transform;$('scale').style.transform='scale(1)';await new Promise(r=>setTimeout(r,80));const canvas=await html2canvas($('flyer'),{width:1080,height:state.format==='square'?1080:1920,scale:1,useCORS:true,backgroundColor:null});$('scale').style.transform=old;scale();const a=document.createElement('a');a.download=`TresArroyos_${state.tipo}_${state.format}_${new Date().toISOString().slice(0,10)}.png`;a.href=canvas.toDataURL('image/png');a.click();b.disabled=false;b.textContent='Descargar PNG'}
window.addEventListener('resize',scale);init();
</script>
</body>
</html>
