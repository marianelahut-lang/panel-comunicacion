<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel V2 · Comunicación Tres Arroyos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src-v2/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div id="login" class="login">
    <section class="login-card">
      <div class="brand-dot">📡</div>
      <h1>Panel Comunicación V2</h1>
      <p>Versión limpia y estable. Usa los mismos datos del panel actual.</p>
      <label>Agente</label>
      <select id="loginUser"><option value="">Cargando equipo...</option></select>
      <label>Contraseña</label>
      <input id="loginPass" type="password" placeholder="Contraseña" />
      <button id="loginBtn" class="primary">Ingresar</button>
      <small id="loginMsg"></small>
    </section>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="side-head">
        <div class="brand-dot small">📡</div>
        <div><strong>Comunicación</strong><span>Panel V2</span></div>
      </div>
      <nav id="nav"></nav>
      <a class="tool-link" href="generador-flyers.html">▣ Generador de flyers</a>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Hoy</h1>
          <p id="pageSub">Resumen operativo diario</p>
        </div>
        <div class="top-actions">
          <span id="liveBadge" class="badge">Conectando...</span>
          <button id="refreshBtn" class="ghost">Actualizar</button>
          <button id="logoutBtn" class="ghost">Salir</button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-card"><div id="modalBody"></div></div></div>
  <div id="toast" class="toast"></div>

  <script type="module" src="src-v2/app.js"></script>
</body>
</html>
