<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Panel · Comunicación Tres Arroyos</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#e7ecf7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    .box{max-width:520px;padding:24px;text-align:center;line-height:1.45}
    .logo{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:linear-gradient(135deg,#f59e0b,#dc2626);display:grid;place-items:center;color:#fff;font-weight:800}
    .msg{color:#9fb0d1;font-size:14px}
  </style>
</head>
<body>
  <div class="box" id="boot">
    <div class="logo">TA</div>
    <h1>Cargando panel...</h1>
    <div class="msg">Un momento.</div>
  </div>
  <script>
  (async function(){
    const source = 'https://raw.githubusercontent.com/marianelahut-lang/panel-comunicacion/bc2b796cb330c12c0fe06eda2c3a82e4995bcd17/index.html';
    try{
      const res = await fetch(source, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      let html = await res.text();
      html = html.replace(
        'function newEvent(date){\n  prepEvent({date:date||todayISO()});\n  openModal(\'evMod\');\n}',
        'function newEvent(date){\n  const defaultDate = date || (calMode===\'day\' ? dateISO(calDayCursor) : todayISO());\n  prepEvent({date:defaultDate});\n  openModal(\'evMod\');\n}'
      );
      html = html.replace(
        "const mat=state.tasks.filter(t=>t.status==='publicar' && !isTaskScheduledForPub(t));",
        "const mat=state.tasks.filter(t=>t.status==='publicar');"
      );
      document.open();
      document.write(html);
      document.close();
    }catch(err){
      document.getElementById('boot').innerHTML = '<div class="logo">TA</div><h1>No se pudo cargar el panel</h1><div class="msg">Actualizá la página en unos segundos. Detalle: '+String(err.message||err)+'</div>';
    }
  })();
  </script>
</body>
</html>
