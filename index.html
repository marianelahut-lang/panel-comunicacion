<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Panel · Comunicación Tres Arroyos</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#e7ecf7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    .box{max-width:520px;padding:24px;text-align:center;line-height:1.45}
    .logo{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:linear-gradient(135deg,#f59e0b,#dc2626);display:grid;place-items:center;color:#fff;font-weight:800}
    .msg{color:#9fb0d1;font-size:14px}
  </style>
</head>
<body>
  <div class="box" id="boot">
    <div class="logo">TA</div>
    <h1>Cargando panel...</h1>
    <div class="msg">Un momento.</div>
  </div>
  <script>
  (async function(){
    const source = 'https://raw.githubusercontent.com/marianelahut-lang/panel-comunicacion/bc2b796cb330c12c0fe06eda2c3a82e4995bcd17/index.html';
    try{
      const res = await fetch(source, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      let html = await res.text();
      html = html.replace('src="drive-auto.js"', 'src="drive-auto.js?v=e8b651ae"');
      // Corrige el botón agrupado de reclamos: el mensaje JSON debe escapar
      // sus comillas para no cortar el atributo onclick en el HTML generado.
      html = html.replace(
        "JSON.stringify(m).replace(/'/g,'&#39;')",
        "esc(JSON.stringify(m))"
      );
      html = html.replace(
        'function newEvent(date){\n  prepEvent({date:date||todayISO()});\n  openModal(\'evMod\');\n}',
        'function newEvent(date){\n  const defaultDate = date || (calMode===\'day\' ? dateISO(calDayCursor) : todayISO());\n  prepEvent({date:defaultDate});\n  openModal(\'evMod\');\n}'
      );
      html = html.replace(
        '<button class="btn btn-p" onclick="addFuncionarioDifusion()">+ Agregar funcionario</button>',
        '<button class="btn btn-p" onclick="addFuncionarioDifusion()">+ Agregar funcionario</button><button class="btn btn-d" data-admin onclick="reiniciarAccionesDifusion()">↺ Reiniciar acciones</button>'
      );
      html = html.replace(
        'function addFuncionarioDifusion(){',
        `function reiniciarAccionesDifusion(){
  if(!requireAdmin())return;
  const conAcciones=state.publicaciones.filter(p=>
    (p.funcionariosDifusion && Object.keys(p.funcionariosDifusion).length) ||
    (parseInt(p.compartidos_manual||0,10)>0)
  );
  if(!conAcciones.length){
    toast('No hay acciones registradas para borrar','inf');
    return;
  }
  if(!confirm('¿Borrar todas las acciones registradas de difusión?\\n\\nSe limpiarán las marcas de todos los funcionarios y los compartidos manuales. Las publicaciones y la agenda no se borrarán.'))return;
  conAcciones.forEach(p=>{
    p.funcionariosDifusion={};
    p.compartidos_manual=0;
    p.updated=Date.now();
  });
  window._dfStatOpen=null;
  saveState();
  renderDifusion();
  updateBadges();
  toast('Acciones de difusión reiniciadas','suc');
}
function addFuncionarioDifusion(){`
      );
      html = html.replace(
        '<button class="btn btn-p btn-s" onclick="newEvent(',
        '<button class="btn btn-w btn-s" onclick="event.stopPropagation();sendCalCoverageWa()">📱 WhatsApp seleccionadas</button><button class="btn btn-p btn-s" onclick="newEvent('
      );
      html = html.replace(
        'function renderCalDay(){',
        `function sendCalCoverageWa(){
  const iso=dateISO(calDayCursor);
  const g=state.guardias[iso];
  if(!g||!g.titular){toast('No hay titular de guardia para este día','err');return}
  const tit=getAg(g.titular);
  if(!tit||!tit.phone){toast('El titular no tiene WhatsApp','err');return}
  const evs=state.events
    .filter(e=>e.date===iso && e.cover===true)
    .sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  if(!evs.length){toast('No hay eventos seleccionados para cubrir','inf');return}
  let msg='*Eventos seleccionados para cubrir · '+new Date(iso+'T00:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})+'*\\n\\n';
  evs.forEach(e=>{
    msg+='• '+(e.time||'Sin horario')+' - '+(e.desc||'Evento')+(e.loc?' ('+e.loc+')':'')+'\\n';
  });
  msg+='\\n_Incluye todos los eventos marcados para cubrir, sin importar el horario ni si pasan a guardia._';
  waOpen(tit.phone,msg);
}
function renderCalDay(){`
      );
      document.open();
      document.write(html);
      document.close();
    }catch(err){
      document.getElementById('boot').innerHTML = '<div class="logo">TA</div><h1>No se pudo cargar el panel</h1><div class="msg">Actualizá la página en unos segundos. Detalle: '+String(err.message||err)+'</div>';
    }
  })();
  </script>
<script src="drive-auto.js"></script>
</body>
</html>
