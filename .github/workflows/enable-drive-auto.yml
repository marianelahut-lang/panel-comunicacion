name: Enable Drive Auto Sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-drive-auto.yml
      - drive-auto.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert drive-auto script tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="drive-auto.js"></script>'
          if tag not in text:
              text = text.replace('</body>', tag + '\n</body>')
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already loads drive-auto.js"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load Drive auto sync helper"
          git push
